<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coral Bay Heat</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #177e96; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #testlog { position: absolute; left: 8px; bottom: 8px; margin: 0; font: 12px monospace; color: #fff; background: rgba(0,0,0,0.55); padding: 6px 8px; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Coral Bay Heat: an open-world crime game. Walk and drive with WASD, enter cars with E, aim and shoot with the mouse."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="testlog"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
